<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open TutorLink</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Georgia, 'Times New Roman', serif;
        background: linear-gradient(165deg, #e8eef8 0%, #f7f4ef 48%, #eef6f1 100%);
        color: #1c2430;
        padding: 24px;
      }
      main {
        width: min(420px, 100%);
        text-align: center;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.75rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 22px;
        line-height: 1.45;
        color: #4a5563;
      }
      a.button {
        display: inline-block;
        padding: 14px 22px;
        border-radius: 10px;
        background: #1c4b82;
        color: #fff;
        text-decoration: none;
        font-family: system-ui, sans-serif;
        font-weight: 600;
      }
      .hint {
        margin-top: 18px;
        font-size: 0.9rem;
        color: #6b7280;
        font-family: system-ui, sans-serif;
      }
      .error {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TutorLink</h1>
      <p id="message">Opening the app to set your new password…</p>
      <a class="button" id="openApp" href="#">Open TutorLink</a>
      <p class="hint" id="hint">
        If nothing happens, install TutorLink and tap the button again.
      </p>
    </main>
    <script>
      (function () {
        // TEMP DEBUG — remove after reset-URL investigation (never log oobCode value)
        var _sp = new URLSearchParams(window.location.search || '');
        console.log('Reset URL:', window.location.href);
        console.log('Pathname:', window.location.pathname);
        console.log('Search params:', window.location.search);
        console.log('Has mode:', _sp.has('mode'));
        console.log('Has oobCode:', _sp.has('oobCode'));
        console.log('Has apiKey:', _sp.has('apiKey'));
        console.log('Has link:', _sp.has('link'));
        console.log('Has continueUrl:', _sp.has('continueUrl'));

        function pickParams(search) {
          var params = new URLSearchParams(search || '');
          var mode = params.get('mode') || '';
          var oobCode = params.get('oobCode') || params.get('oobcode') || '';
          if (oobCode) {
            return { mode: mode || 'resetPassword', oobCode: oobCode };
          }
          var nested =
            params.get('link') ||
            params.get('continueUrl') ||
            params.get('deep_link_id');
          if (nested) {
            try {
              var nestedUrl = new URL(nested);
              return pickParams(nestedUrl.search);
            } catch (e) {}
          }
          return null;
        }

        var parsed = pickParams(window.location.search);
        var openApp = document.getElementById('openApp');
        var message = document.getElementById('message');
        var hint = document.getElementById('hint');

        if (!parsed || !parsed.oobCode) {
          message.textContent = 'This page is only a continue URL — no reset code here.';
          message.className = 'error';
          openApp.style.display = 'none';
          // TEMP on-page debug (no oobCode value) so mobile Chrome can confirm URL shape
          hint.textContent =
            'The email link must be the /__/auth/links URL (with oobCode inside link=), and Android must open TutorLink — not this bare /auth/action page. ' +
            'Debug: path=' +
            window.location.pathname +
            ' | searchEmpty=' +
            (!window.location.search) +
            ' | hasMode=' +
            _sp.has('mode') +
            ' | hasOob=' +
            _sp.has('oobCode') +
            ' | hasApiKey=' +
            _sp.has('apiKey');
          console.log('Reset page: missing oobCode in window.location.search');
          return;
        }

        var query =
          'mode=' +
          encodeURIComponent(parsed.mode) +
          '&oobCode=' +
          encodeURIComponent(parsed.oobCode);
        var appScheme = 'tutorlink://reset-password?' + query;
        var androidIntent =
          'intent://reset-password?' +
          query +
          '#Intent;scheme=tutorlink;package=com.tutorlink;end';
        var isAndroid = /android/i.test(navigator.userAgent || '');
        var target = isAndroid ? androidIntent : appScheme;

        openApp.setAttribute('href', target);
        openApp.addEventListener('click', function (event) {
          event.preventDefault();
          window.location.href = target;
        });

        // Auto-open the app (works from Gmail/Chrome where App Links may not).
        window.setTimeout(function () {
          window.location.href = target;
        }, 120);
      })();
    </script>
  </body>
</html>
