<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=430, height=932, initial-scale=1" />
  <title>Register — TutorLink</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&display=block" />
  <link rel="stylesheet" href="../assets/shared.css" />
</head>
<body>
<div class="phone"><div class="screen">
  <div class="auth-header">
    <div class="auth-back"><span class="mi ">arrow_back</span></div>
    <div class="brand">TutorLink</div>
    <div class="auth-accent"></div>
    <div class="h1">Create Account</div>
    <div class="subtitle mt-8">Join TutorLink and start your learning journey</div>
  </div>
  <div class="glass-card">
    <div class="field"><div class="field-label">Full Name</div><div class="input filled"><span class="mi ">person</span><span>Ahmed Khan</span></div></div>
    <div class="field"><div class="field-label">Email</div><div class="input filled"><span class="mi ">mail</span><span>ahmed.khan@example.com</span></div></div>
    <div class="field"><div class="field-label">Password</div><div class="input filled"><span class="mi ">lock</span><span style="flex:1">••••••••</span><span class="mi ">visibility_off</span></div></div>
    <div class="field"><div class="field-label">Confirm Password</div><div class="input filled"><span class="mi ">lock</span><span style="flex:1">••••••••</span><span class="mi ">visibility</span></div></div>
    <div class="btn-primary mt-8">Create Account</div>
  </div>
  <div class="auth-footer">Already have an account? <span class="link">Log In</span></div>
</div></div></body></html>
